name: Build Android APK v5
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build APK
        run: |
          cd ReelsBlockerv5
          chmod +x gradlew || true
          ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsBlocker-v5-APK
          path: ReelsBlockerv5/app/build/outputs/apk/debug/app-debug.apk
